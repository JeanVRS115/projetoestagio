<div class="card">

  <h2>Lista de Comércios</h2>

  <p-table
    [value]="listaComercios"
    [loading]="carregando"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]"
    styleClass="p-datatable-gridlines"
    [tableStyle]="{ 'min-width': '70rem' }">

    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Comércio</th>
        <th>Responsável</th>
        <th>Tipo</th>
        <th>Cidade</th>
        <th>Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-comercio>
      <tr>
        <td>{{ comercio.id }}</td>

        <td>
          {{ comercio.nomeComercio }}
        </td>

        <td>
          {{ comercio.nomeResponsavel }}
        </td>

        <td>
          {{ formatarTipo(comercio.tipoComercio) }}
        </td>

        <td>
          {{ nomeCidade(comercio.cidadeId) }}
        </td>

        <td style="width: 250px">
          <p-button
            label="Alterar"
            (click)="abrirAlteracao(comercio)">
          </p-button>

          &nbsp;

          <p-button
            label="Excluir"
            severity="danger"
            (click)="excluir(comercio)">
          </p-button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">
          Nenhum comércio cadastrado.
        </td>
      </tr>
    </ng-template>

  </p-table>

  <br>

  <div class="flex gap-2">
    <p-button
      label="Novo Comércio"
      icon="pi pi-plus"
      (click)="abrirCadastro()">
    </p-button>

    <p-button
      label="Atualizar"
      icon="pi pi-refresh"
      severity="secondary"
      (click)="pesquisarComercios()">
    </p-button>
  </div>

  <cadastrar-comercio
    *ngIf="mostraJanelaCadastro"
    [comercio]="comercioSelecionado"
    (onClose)="fecharCadastro($event)">
  </cadastrar-comercio>

</div>
