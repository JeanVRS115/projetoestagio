<p-toast></p-toast>

<p-tabView>

  <p-tabPanel header="Cidades">

    <div class="card justify-content-center">

      <h2>Lista de Cidades</h2>

      <p-table
        [value]="listaCidades"
        [paginator]="true"
        [rows]="5"
        [rowsPerPageOptions]="[5, 10, 20]"
        styleClass="p-datatable-gridlines"
        [tableStyle]="{ 'min-width': '50rem' }">

        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>UF</th>
            <th>Capital</th>
            <th>Ações</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-cidade>
          <tr>
            <td>{{ cidade.id }}</td>
            <td>{{ cidade.nome }}</td>
            <td>{{ cidade.uf }}</td>
            <td>
              {{ cidade.capital ? 'Sim' : 'Não' }}
            </td>
            <td style="width: 250px">
              <p-button
                label="Alterar"
                (click)="abreJanelaParaAlterarCidade(cidade)">
              </p-button>

              &nbsp;

              <p-button
                label="Excluir"
                severity="danger"
                (click)="excluir(cidade)">
              </p-button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5">
              Nenhuma cidade cadastrada.
            </td>
          </tr>
        </ng-template>

      </p-table>

      <br>

      <p-button
        label="Nova Cidade"
        (click)="abreJanelaParaCadastrarNovaCidade()">
      </p-button>

      <cadastrar-cidade
        *ngIf="mostraJanelaCadastro"
        [cidade]="cidadeSelecionada"
        (onClose)="fechaJanelaCadastro($event)">
      </cadastrar-cidade>

    </div>

  </p-tabPanel>

  <p-tabPanel header="Comércios">

    <listar-comercios></listar-comercios>

  </p-tabPanel>

</p-tabView>
